name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        id: info
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "error: tag $TAG does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: context
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        run: |
          ZIG_VERSION=0.13.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" | tar -xJ
          sudo mv "zig-linux-x86_64-${ZIG_VERSION}" /usr/local/zig
          sudo ln -sf /usr/local/zig/zig /usr/local/bin/zig
          zig version

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build tarball
        run: make -C packaging/linux tarball LINUX_TARGET=${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ush-${{ matrix.target }}
          path: target/release/ush-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  build-macos:
    needs: context
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build tarball
        run: make -C packaging/linux tarball LINUX_TARGET=aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ush-aarch64-apple-darwin
          path: target/release/ush-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

  release:
    needs: [context, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/release
          pattern: ush-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd target/release
          sha256sum ush-*.tar.gz > SHA256SUMS

      - name: Generate release metadata
        run: |
          ./scripts/generate-release-metadata.sh \
            "${{ needs.context.outputs.version }}" \
            target/release \
            site/static/dl/cli

      - name: Install Zola
        run: |
          ZOLA_VERSION=0.22.1
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin zola

      - name: Build site
        run: |
          cd site
          zola build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.context.outputs.tag }}
          name: ush ${{ needs.context.outputs.version }}
          files: |
            target/release/ush-*.tar.gz
            target/release/SHA256SUMS

      - name: Upload updated site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy-site:
    needs: release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
